<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3f6f"/>
      <stop offset="100%" style="stop-color:#4a7ec4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="60" rx="8" fill="url(#bg)"/>
  <!-- Mini forest plot bars -->
  <line x1="18" y1="15" x2="18" y2="45" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="20" x2="26" y2="20" stroke="#e8d5b7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="20" r="2.5" fill="#e8d5b7"/>
  <line x1="12" y1="28" x2="24" y2="28" stroke="#e8d5b7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="28" r="2.5" fill="#e8d5b7"/>
  <line x1="8" y1="36" x2="28" y2="36" stroke="#e8d5b7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="36" r="2.5" fill="#e8d5b7"/>
  <!-- Diamond -->
  <polygon points="14,44 18,41 22,44 18,47" fill="#e8611a"/>
  <!-- Text -->
  <text x="36" y="26" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white">metapropul</text>
  <text x="36" y="42" font-family="Arial,sans-serif" font-size="8.5" fill="#b8d0ef" letter-spacing="0.3">Meta-Analysis Toolkit for R</text>
</svg>
