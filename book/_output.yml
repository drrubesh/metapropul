bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">
          <img src="images/logo.png" alt="metapropul" style="width:180px; padding:10px 5px 5px 5px;">
        </a></li>
        <li><a href="./">metapropul</a></li>
      after: |
        <li><a href="https://github.com/drrubesh/metapropul" target="blank">
          <i class="fa fa-github"></i> GitHub
        </a></li>
    download: ["pdf"]
    edit:
      link: https://github.com/drrubesh/metapropul/edit/main/docs/%s
    search: yes
    fontsettings:
      theme: white
      family: sans
      size: 2
    sharing:
      github: yes
      twitter: yes
      all: ['github', 'twitter']
  includes:
    in_header: header.html

bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
